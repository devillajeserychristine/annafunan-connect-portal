<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="outerGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B755" />
      <stop offset="25%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#C69222" />
      <stop offset="75%" stop-color="#FCE082" />
      <stop offset="100%" stop-color="#8F620D" />
    </linearGradient>

    <radialGradient id="innerBlueGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1A4A9E" />
      <stop offset="45%" stop-color="#0E337A" />
      <stop offset="85%" stop-color="#071E4D" />
      <stop offset="100%" stop-color="#041233" />
    </radialGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="40%" stop-color="#FBC02D" />
      <stop offset="80%" stop-color="#F57F17" />
      <stop offset="100%" stop-color="#E65100" />
    </radialGradient>

    <linearGradient id="torchGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="35%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#FFF8DC" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>

    <linearGradient id="flameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#D84315" />
      <stop offset="35%" stop-color="#F57C00" />
      <stop offset="70%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFF9C4" />
    </linearGradient>

    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63" />
      <stop offset="40%" stop-color="#BCAAA4" />
      <stop offset="75%" stop-color="#795548" />
      <stop offset="100%" stop-color="#4E342E" />
    </linearGradient>

    <filter id="sealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35" flood-color="#051329" />
    </filter>

    <!-- Text Paths -->
    <!-- Top Arc for ANNAFUNAN INTEGRATED SCHOOL -->
    <path id="topTextArc" d="M 62,250 A 188,188 0 1,1 438,250" fill="none" />
    <!-- Bottom Arc for TUGUEGARAO CITY -->
    <path id="bottomTextArc" d="M 436,250 A 186,186 0 0,1 64,250" fill="none" />
  </defs>

  <!-- Outer Shadow & Edge -->
  <circle cx="250" cy="250" r="246" fill="#6D4C0A" filter="url(#sealShadow)" />
  <circle cx="250" cy="250" r="244" fill="url(#outerGoldGrad)" stroke="#5D3E06" stroke-width="2" />
  
  <!-- Outer Beaded Pattern / Concentric Trim -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#9A6B0F" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="250" cy="250" r="232" fill="none" stroke="#5D3E06" stroke-width="2" />

  <!-- Inner Edge of Gold Ring -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="#4A3104" stroke-width="2.5" />
  <circle cx="250" cy="250" r="169" fill="none" stroke="#D4AF37" stroke-width="1.5" />

  <!-- TEXT ON OUTER GOLD RING -->
  <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#141E30" letter-spacing="3.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      ANNAFUNAN INTEGRATED SCHOOL
    </textPath>
  </text>

  <!-- Stars flanking bottom text -->
  <g fill="#FFFFFF" stroke="#6D4C0A" stroke-width="1">
    <!-- Left star at approx angle -->
    <polygon points="90,378 95,392 109,392 98,401 102,415 90,406 78,415 82,401 71,392 85,392" transform="scale(0.7) translate(40, 160)" />
    <!-- Right star at approx angle -->
    <polygon points="90,378 95,392 109,392 98,401 102,415 90,406 78,415 82,401 71,392 85,392" transform="scale(0.7) translate(490, 160)" />
  </g>

  <text font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="26" fill="#141E30" letter-spacing="4">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      ★ TUGUEGARAO CITY ★
    </textPath>
  </text>

  <!-- INNER BLUE FIELD -->
  <circle cx="250" cy="250" r="166" fill="url(#innerBlueGrad)" stroke="#113066" stroke-width="3" />

  <!-- Two White 5-pointed Stars in upper blue field -->
  <g fill="#FFFFFF" opacity="0.95">
    <polygon points="200,126 204,138 216,138 206,146 210,158 200,150 190,158 194,146 184,138 196,138" transform="scale(0.85) translate(35, 15)" />
    <polygon points="300,126 304,138 316,138 306,146 310,158 300,150 290,158 294,146 284,138 296,138" transform="scale(0.85) translate(48, 15)" />
  </g>

  <!-- SUN & SUNBURST RAYS -->
  <g id="sunburst">
    <!-- Sun rays -->
    <g fill="#FBC02D" stroke="#E65100" stroke-width="0.5" opacity="0.95">
      <polygon points="250,250 170,180 185,170" />
      <polygon points="250,250 185,160 205,152" />
      <polygon points="250,250 210,145 230,140" />
      <polygon points="250,250 240,138 260,138" />
      <polygon points="250,250 270,140 290,145" />
      <polygon points="250,250 295,152 315,160" />
      <polygon points="250,250 315,170 330,180" />
      <polygon points="250,250 330,195 342,210" />
      <polygon points="250,250 158,210 170,195" />
    </g>
    <!-- Sun Half Disc -->
    <path d="M 188,250 A 62,62 0 0,1 312,250 Z" fill="url(#sunGlow)" stroke="#F57F17" stroke-width="1.5" />
  </g>

  <!-- LAUREL WREATH (Both sides) -->
  <g id="laurel-wreath" fill="url(#outerGoldGrad)" stroke="#78530C" stroke-width="0.75">
    <!-- Left Wreath Leaves -->
    <ellipse cx="140" cy="205" rx="7" ry="15" transform="rotate(-35 140 205)" />
    <ellipse cx="132" cy="225" rx="7" ry="16" transform="rotate(-25 132 225)" />
    <ellipse cx="128" cy="250" rx="7" ry="17" transform="rotate(-10 128 250)" />
    <ellipse cx="130" cy="275" rx="7" ry="17" transform="rotate(10 130 275)" />
    <ellipse cx="138" cy="300" rx="8" ry="17" transform="rotate(30 138 300)" />
    <ellipse cx="152" cy="325" rx="8" ry="17" transform="rotate(45 152 325)" />
    <ellipse cx="172" cy="348" rx="8" ry="17" transform="rotate(60 172 348)" />
    <ellipse cx="198" cy="365" rx="8" ry="17" transform="rotate(75 198 365)" />
    <ellipse cx="225" cy="375" rx="7" ry="16" transform="rotate(85 225 375)" />

    <!-- Inner left pair leaves -->
    <ellipse cx="148" cy="220" rx="6" ry="13" transform="rotate(-15 148 220)" />
    <ellipse cx="144" cy="245" rx="6" ry="14" transform="rotate(0 144 245)" />
    <ellipse cx="146" cy="270" rx="6" ry="14" transform="rotate(15 146 270)" />
    <ellipse cx="155" cy="295" rx="6" ry="14" transform="rotate(35 155 295)" />
    <ellipse cx="170" cy="320" rx="6" ry="14" transform="rotate(50 170 320)" />
    <ellipse cx="192" cy="342" rx="6" ry="14" transform="rotate(65 192 342)" />

    <!-- Right Wreath Leaves -->
    <ellipse cx="360" cy="205" rx="7" ry="15" transform="rotate(35 360 205)" />
    <ellipse cx="368" cy="225" rx="7" ry="16" transform="rotate(25 368 225)" />
    <ellipse cx="372" cy="250" rx="7" ry="17" transform="rotate(10 372 250)" />
    <ellipse cx="370" cy="275" rx="7" ry="17" transform="rotate(-10 370 275)" />
    <ellipse cx="362" cy="300" rx="8" ry="17" transform="rotate(-30 362 300)" />
    <ellipse cx="348" cy="325" rx="8" ry="17" transform="rotate(-45 348 325)" />
    <ellipse cx="328" cy="348" rx="8" ry="17" transform="rotate(-60 328 348)" />
    <ellipse cx="302" cy="365" rx="8" ry="17" transform="rotate(-75 302 365)" />
    <ellipse cx="275" cy="375" rx="7" ry="16" transform="rotate(-85 275 375)" />

    <!-- Inner right pair leaves -->
    <ellipse cx="352" cy="220" rx="6" ry="13" transform="rotate(15 352 220)" />
    <ellipse cx="356" cy="245" rx="6" ry="14" transform="rotate(0 356 245)" />
    <ellipse cx="354" cy="270" rx="6" ry="14" transform="rotate(-15 354 270)" />
    <ellipse cx="345" cy="295" rx="6" ry="14" transform="rotate(-35 345 295)" />
    <ellipse cx="330" cy="320" rx="6" ry="14" transform="rotate(-50 330 320)" />
    <ellipse cx="308" cy="342" rx="6" ry="14" transform="rotate(-65 308 342)" />
  </g>

  <!-- TORCH & FLAME -->
  <g id="torch">
    <!-- Golden Torch Column -->
    <path d="M 242,280 L 258,280 L 255,205 L 245,205 Z" fill="url(#torchGold)" stroke="#6A4904" stroke-width="1.2" />
    
    <!-- Torch Chalice / Bowl Top -->
    <path d="M 233,205 L 267,205 L 273,184 L 227,184 Z" fill="url(#torchGold)" stroke="#6A4904" stroke-width="1.5" />
    <ellipse cx="250" cy="184" rx="23" ry="5" fill="#FFE082" stroke="#6A4904" stroke-width="1" />

    <!-- Torch Multi-Tier Flame -->
    <!-- Outer Flame -->
    <path d="M 250,110 C 265,135 285,145 270,178 C 260,183 240,183 230,178 C 215,145 235,135 250,110 Z" fill="url(#flameGrad)" opacity="0.95" />
    <!-- Secondary Flame tongue -->
    <path d="M 246,120 C 258,138 274,152 263,176 C 255,180 242,180 236,176 C 228,155 240,135 246,120 Z" fill="#FFA000" />
    <!-- Bright inner flame core -->
    <path d="M 248,132 C 255,145 264,158 258,175 C 253,178 245,178 241,175 C 235,160 243,145 248,132 Z" fill="#FFFDE7" />
  </g>

  <!-- OPEN BOOK IN FOREGROUND -->
  <g id="open-book">
    <!-- Book Drop Shadow -->
    <path d="M 166,325 Q 250,340 334,325 L 340,332 Q 250,348 160,332 Z" fill="#030A19" opacity="0.6" />

    <!-- Book Base / Cover Rim -->
    <path d="M 160,328 Q 210,324 250,332 Q 290,324 340,328 L 343,322 Q 290,317 250,326 Q 210,317 157,322 Z" fill="#8D6E63" stroke="#5D4037" stroke-width="1" />

    <!-- Book Left Pages Stack -->
    <path d="M 162,322 C 190,318 220,318 250,326 L 250,258 C 218,252 185,255 168,264 Z" fill="#EDE7D9" stroke="#BCAAA4" stroke-width="1" />
    <path d="M 165,320 C 192,316 220,316 250,324 L 250,256 C 218,250 188,253 171,262 Z" fill="#F7F4EC" stroke="#D7CCC8" stroke-width="0.8" />
    <path d="M 168,318 C 195,314 220,314 250,322 L 250,254 C 220,248 190,251 174,260 Z" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="0.8" />

    <!-- Page Text Lines (Left) -->
    <line x1="184" y1="274" x2="238" y2="268" stroke="#B0BEC5" stroke-width="1.2" stroke-linecap="round" />
    <line x1="182" y1="284" x2="238" y2="278" stroke="#B0BEC5" stroke-width="1.2" stroke-linecap="round" />
    <line x1="180" y1="294" x2="238" y2="288" stroke="#B0BEC5" stroke-width="1.2" stroke-linecap="round" />
    <line x1="178" y1="304" x2="238" y2="298" stroke="#B0BEC5" stroke-width="1.2" stroke-linecap="round" />

    <!-- Book Right Pages Stack -->
    <path d="M 338,322 C 310,318 280,318 250,326 L 250,258 C 282,252 315,255 332,264 Z" fill="#EDE7D9" stroke="#BCAAA4" stroke-width="1" />
    <path d="M 335,320 C 308,316 280,316 250,324 L 250,256 C 282,250 312,253 329,262 Z" fill="#F7F4EC" stroke="#D7CCC8" stroke-width="0.8" />
    <path d="M 332,318 C 305,314 280,314 250,322 L 250,254 C 280,248 310,251 326,260 Z" fill="#FFFFFF" stroke="#D7CCC8" stroke-width="0.8" />

    <!-- Page Text Lines (Right) -->
    <line x1="262" y1="268" x2="316" y2="274" stroke="#B0BEC5" stroke-width="1.2" stroke-linecap="round" />
    <line x1="262" y1="278" x2="318" y2="284" stroke="#B0BEC5" stroke-width="1.2" stroke-linecap="round" />
    <line x1="262" y1="288" x2="320" y2="294" stroke="#B0BEC5" stroke-width="1.2" stroke-linecap="round" />
    <line x1="262" y1="298" x2="322" y2="304" stroke="#B0BEC5" stroke-width="1.2" stroke-linecap="round" />

    <!-- Center Binding Shadow -->
    <path d="M 248,254 L 252,254 L 252,324 L 248,324 Z" fill="#9E9E9E" opacity="0.6" />
  </g>

  <!-- FEATHER QUILL PEN -->
  <g id="quill-pen">
    <!-- Quill Feather Silhouette & Vanes -->
    <path d="M 268,335 C 285,310 325,270 358,248 C 352,260 338,280 322,300 C 305,318 285,330 268,335 Z" fill="url(#featherGrad)" stroke="#5D4037" stroke-width="0.8" />
    <!-- Feather Shaft / Spine -->
    <path d="M 262,342 Q 310,295 362,244" fill="none" stroke="#EFEBE9" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 262,342 Q 310,295 362,244" fill="none" stroke="#4E342E" stroke-width="0.8" />
    <!-- Feather Vane Cuts -->
    <line x1="335" y1="268" x2="322" y2="278" stroke="#3E2723" stroke-width="0.75" />
    <line x1="320" y1="285" x2="305" y2="295" stroke="#3E2723" stroke-width="0.75" />
    <line x1="300" y1="305" x2="288" y2="315" stroke="#3E2723" stroke-width="0.75" />
    <!-- Nib tip -->
    <polygon points="262,342 258,348 266,344" fill="#2E1C0C" />
  </g>

  <!-- 1926-2020 BANNER BELOW BOOK -->
  <g id="year-banner">
    <path d="M 190,342 L 310,342 L 305,362 L 195,362 Z" fill="#0A2254" stroke="url(#outerGoldGrad)" stroke-width="1.5" />
    <text x="250" y="357" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      1926-2020
    </text>
  </g>
</svg>
